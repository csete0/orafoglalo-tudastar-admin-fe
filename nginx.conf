server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/admin.crt;
    ssl_certificate_key /etc/nginx/admin.key;

    # Csak belső hálózat. A WireGuard-kliensek is innen jönnek (a VPN-szerver NAT-ol).
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Docker DNS, változós upstream: az admin-api újraépítése (új konténer-IP) után se ragadjon a régi címen (502, 10-24).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/admin/ {
        set $admin_api http://admin-api:7090;
        proxy_pass $admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
