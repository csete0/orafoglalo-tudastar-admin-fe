@if (authStore.isAuthenticated()) {
  <header class="topbar print:hidden">
    <span class="brand">Patricks Admin</span>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Kezdőlap</a>
      @for (item of menu; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
      <a href="#" (click)="openHangfire($event)">Háttérfeladatok</a>
    </nav>
    <div class="who">
      <span>{{ authStore.displayName() || authStore.email() }}</span>
      <button type="button" (click)="logout()">Kijelentkezés</button>
    </div>
  </header>
}
<main>
  <router-outlet />
</main>
<app-confirm-dialog />
<app-toast />
