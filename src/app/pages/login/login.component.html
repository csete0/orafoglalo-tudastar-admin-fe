<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Patricks Admin</h1>
    <p class="hint">LAN/WireGuard-only belépés</p>

    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }

    <label>
      Email
      <input type="email" name="email" formControlName="email" required autocomplete="username" />
    </label>

    <label>
      Jelszó
      <input type="password" name="password" formControlName="password" required autocomplete="current-password" />
    </label>

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Belépés...' : 'Belépés' }}
    </button>
  </form>
</div>
