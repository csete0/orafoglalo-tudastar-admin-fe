<h1>Kezdőlap</h1>
<p class="lead">A hozzáférési modell (F1) kész - a támogatói eszközök innen indulnak majd.</p>

<ul class="upcoming">
  @for (item of items; track item.label) {
    <li>
      @if (item.route) {
        <a [routerLink]="item.route" class="label">{{ item.label }}</a>
      } @else {
        <span class="label disabled">{{ item.label }}</span>
      }
      <span class="note">{{ item.note }}</span>
    </li>
  }
</ul>
